# ==============================================================================
# NOTEBOOKLM MCP INTEGRATION DOCTRINE V2
# SCOPE: SovereignNexus / Phase 32 A2UI
# PURPOSE: Deterministic, cached context injection for parallel worktree agents
# ==============================================================================

templates:
  # 1. DEPENDENCY TEMPLATE: Structural Awareness & Blast Radius
  - name: "dependency"
    description: "Extracts structural dependencies and GitNexus impact analysis for a specific module."
    prompt_template: >
      Query NotebookLM: Generate a strict, bulleted dependency map for [TARGET_MODULE]. 
      Include upstream callers, downstream callees, and GitNexus structural boundaries. 
      Omit implementation details. Delta only.
    cache_path: "docs/notebook-cache/dependency_[TARGET_MODULE].md"
    max_tokens: 500

  # 2. ERROR TEMPLATE: Failure Modes & Chaos Petri Sandbox
  - name: "error"
    description: "Retrieves known failure modes, error traces, and validation requirements."
    prompt_template: >
      Query NotebookLM: List known failure modes, recent error logs, and validation 
      requirements for [TARGET_MODULE]. Focus on Fail-Closed criteria and safety 
      gates before SSE emit.
    cache_path: "docs/notebook-cache/error_[TARGET_MODULE].md"
    max_tokens: 500

  # 3. CONTRACT TEMPLATE: Immutable Interface & Schema Rules
  - name: "contract"
    description: "Pulls locked interface contracts and schema requirements."
    prompt_template: >
      Query NotebookLM: Provide the locked interface contract and schema constraints 
      for [TARGET_MODULE]. 
      PHASE 32 A2UI OVERRIDE: Ensure strict adherence to the 18-component primitive 
      limit and two-way interactive form data models. Do not hallucinate UI components.
    cache_path: "docs/notebook-cache/contract_[TARGET_MODULE].md"
    max_tokens: 800

  # 4. STATE TEMPLATE: Checkpoints & RCE Hand-offs
  - name: "state"
    description: "Retrieves the current execution state and phase checkpoints."
    prompt_template: >
      Query NotebookLM: Summarize the current execution state and Resumable Cognitive 
      Execution (RCE) checkpoints for [TARGET_MODULE]. Detail merged PRs, active 
      git worktrees, and outstanding tasks. Omit conversational history.
    cache_path: "docs/notebook-cache/state_[TARGET_MODULE].md"
    max_tokens: 400
