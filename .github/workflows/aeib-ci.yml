name: AEIB v1.0 Minimal CI Baseline

on:
  push:
    branches:
      - main
      - "release/v1.0-review-candidate"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "release/v1.0-review-candidate"
  workflow_dispatch:

permissions: read-all

jobs:
  clean-test:
    name: "Gate 1 & Gate 4 Clean Test Baseline (JDK 21)"
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.compute-hashes.outputs.hashes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.12 for cross-language receipt verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python cryptography primitive
        run: python3 -m pip install cryptography==44.0.0

      - name: Verify Gradle 8.5 wrapper JAR SHA-256
        run: |
          echo "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          echo "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd  aeib-native-runtime/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run clean test suite and assemble verifier distribution
        run: ./gradlew clean test :aeib-verifier:installDist cyclonedxBom --no-daemon --stacktrace

      - name: Reproducible Build-Twice-and-Diff Check (Action 19)
        run: |
          set -euo pipefail
          SHA_BUILD_1=$(sha256sum aeib-native-runtime/aeib-verifier/build/libs/aeib-verifier-1.0.0-rc.1.jar | awk '{print $1}')
          ./gradlew :aeib-verifier:jar --rerun-tasks --no-daemon
          SHA_BUILD_2=$(sha256sum aeib-native-runtime/aeib-verifier/build/libs/aeib-verifier-1.0.0-rc.1.jar | awk '{print $1}')
          echo "Build 1 SHA-256: $SHA_BUILD_1"
          echo "Build 2 SHA-256: $SHA_BUILD_2"
          if [ "$SHA_BUILD_1" != "$SHA_BUILD_2" ]; then
            echo "ERROR: Reproducible build check failed: $SHA_BUILD_1 != $SHA_BUILD_2"
            exit 1
          fi
          echo "OK: Reproducible build verified (0-byte archive divergence)"

      - name: Execute cross-language receipt verification
        run: python3 benchmarks/jvm_native_diff_engine.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**

      - name: Bound SLSA provenance artifact scope
        run: |
          mkdir -p release-artifacts
          cp aeib-native-runtime/aeib-verifier/build/install/aeib-verifier/bin/aeib-verifier release-artifacts/aeib-verifier
          cp aeib-native-runtime/aeib-verifier/build/libs/aeib-verifier-1.0.0-rc.1.jar release-artifacts/
          cp aeib-native-runtime/build/reports/bom.json release-artifacts/
          cp AEIB-RECEIPT-SPEC.md release-artifacts/
          cp benchmarks/jvm_native_diff_engine.py release-artifacts/

      - name: Compute artifact hashes (SLSA v2.1.0 Base64 Contract)
        id: compute-hashes
        run: |
          set -euo pipefail
          cd release-artifacts
          HASHES=$(find . -maxdepth 1 -type f -exec sha256sum {} + | sed 's| \./| |' | sort -k2 | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: release-artifacts/

  provenance:
    name: "SLSA L3 Isolated Provenance Generator"
    needs: [clean-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.clean-test.outputs.hashes }}"
