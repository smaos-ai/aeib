name: AEIB v1.0 Minimal CI Baseline

on:
  push:
    branches:
      - main
      - "release/v1.0-review-candidate"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "release/v1.0-review-candidate"
  workflow_dispatch:

permissions: read-all

jobs:
  clean-test:
    name: "Gate 1 & Gate 4 Clean Test Baseline (JDK 21)"
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.compute-hashes.outputs.hashes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.12 for cross-language receipt verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python cryptography primitive
        run: python3 -m pip install cryptography

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run clean test suite and assemble verifier distribution
        run: ./gradlew clean test :aeib-verifier:installDist cyclonedxBom --no-daemon --stacktrace

      - name: Execute cross-language receipt verification
        run: python3 benchmarks/jvm_native_diff_engine.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**

      - name: Bound SLSA provenance artifact scope
        run: |
          mkdir -p release-artifacts
          cp aeib-native-runtime/aeib-verifier/build/install/aeib-verifier/bin/aeib-verifier release-artifacts/aeib-verifier
          cp aeib-native-runtime/aeib-verifier/build/libs/aeib-verifier-1.0.0-rc.1.jar release-artifacts/
          cp aeib-native-runtime/build/reports/bom.json release-artifacts/
          cp AEIB-RECEIPT-SPEC.md release-artifacts/
          cp benchmarks/jvm_native_diff_engine.py release-artifacts/

      - name: Compute artifact hashes (SLSA v2.1.0 Base64 Contract)
        id: compute-hashes
        run: |
          set -euo pipefail
          cd release-artifacts
          HASHES=$(find . -maxdepth 1 -type f -exec sha256sum {} + | sed 's| \./| |' | sort -k2 | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/

  provenance:
    name: "SLSA L3 Isolated Provenance Generator"
    needs: [clean-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.clean-test.outputs.hashes }}"
