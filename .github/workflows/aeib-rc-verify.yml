name: AEIB RC Verification and Provenance
on:
  push:
    branches:
      - main
      - release/v1.0-review-candidate
    tags:
      - 'v*.*.*-rc.*'

permissions:
  actions: read
  id-token: write
  contents: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
          
      - name: Build, Test, and Package
        run: |
          ./gradlew clean test
          ./gradlew :aeib-verifier:installDist
          ./gradlew cyclonedxBom

      - name: Collect Release Artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          # Verifier distribution
          test -d aeib-native-runtime/aeib-verifier/build/install/aeib-verifier
          cp -a aeib-native-runtime/aeib-verifier/build/install/aeib-verifier release-artifacts/

          # SBOM
          test -f aeib-native-runtime/build/reports/bom.json
          cp aeib-native-runtime/build/reports/bom.json release-artifacts/

          # Gate 4 evidence artifacts
          test -f aeib-native-runtime/build/test-results/receipt.json
          cp aeib-native-runtime/build/test-results/receipt.json release-artifacts/

          test -f aeib-native-runtime/build/test-results/ledger-public.pem
          cp aeib-native-runtime/build/test-results/ledger-public.pem release-artifacts/

      - name: Compute Artifact Hashes for SLSA (Base64)
        id: hashes
        run: |
          set -euo pipefail
          FILES=$(find release-artifacts -type f | sort)
          if [[ -z "$FILES" ]]; then
            echo "ERROR: no release artifacts found"
            exit 1
          fi
          # SLSA generator_generic_slsa3 requires sha256sum output, Base64-encoded
          HASHES=$(sha256sum $FILES | base64 -w0)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aeib-release-artifacts
          path: release-artifacts/

  verify-receipt-offline:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: aeib-release-artifacts
          path: release-artifacts
          
      - name: Setup JQ
        run: sudo apt-get install -y jq
          
      - name: Standalone Verifier - Valid Receipt
        run: |
          chmod +x release-artifacts/aeib-verifier/bin/aeib-verifier
          ./release-artifacts/aeib-verifier/bin/aeib-verifier \
            --receipt release-artifacts/receipt.json \
            --pubkey release-artifacts/ledger-public.pem
          
      - name: Standalone Verifier - Tampered Receipt
        run: |
          sed 's/OP-GATE4-REAL/OP-HACKED/' release-artifacts/receipt.json > release-artifacts/receipt.tampered.json
          
          # Assert tampered file remains valid JSON (testing signature rejection, not JSON parse error)
          jq -e . release-artifacts/receipt.tampered.json > /dev/null
          
          # Explicit exit-code handling
          set +e
          ./release-artifacts/aeib-verifier/bin/aeib-verifier \
            --receipt release-artifacts/receipt.tampered.json \
            --pubkey release-artifacts/ledger-public.pem
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ERROR: tampered receipt unexpectedly verified"
            exit 1
          fi
          echo "OK: tampered receipt rejected with exit code $status"

  # Temporarily disabled until the v2.1.0 contract is verified against upstream.
