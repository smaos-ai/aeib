name: AEIB RC Verification and Provenance
on:
  push:
    branches:
      - main
      - release/v1.0-review-candidate
    tags:
      - 'v*.*.*-rc.*'

permissions: read-all

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.5.0
        with:
          gradle-version: '8.5'
          cache-disabled: true
          
      - name: Build, Test, and Package
        run: |
          ./gradlew clean check
          ./gradlew :aeib-verifier:installDist
          ./gradlew cyclonedxBom
          ./gradlew generateSlsaSubjects

      - name: Collect Release Artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          # Verifier distribution
          test -d aeib-native-runtime/aeib-verifier/build/install/aeib-verifier
          cp -a aeib-native-runtime/aeib-verifier/build/install/aeib-verifier release-artifacts/

          # SBOM
          test -f aeib-native-runtime/build/reports/bom.json
          cp aeib-native-runtime/build/reports/bom.json release-artifacts/

          # SLSA subjects envelope
          test -f aeib-native-runtime/build/reports/slsa/subjects.json
          cp aeib-native-runtime/build/reports/slsa/subjects.json release-artifacts/
          cp aeib-native-runtime/build/reports/slsa/subjects.base64 release-artifacts/

          # Gate 4 evidence artifacts
          test -f aeib-native-runtime/build/test-results/receipt.json
          cp aeib-native-runtime/build/test-results/receipt.json release-artifacts/

          test -f aeib-native-runtime/build/test-results/ledger-public.pem
          cp aeib-native-runtime/build/test-results/ledger-public.pem release-artifacts/

          # Deterministic test vectors & manifest
          test -d aeib-native-runtime/aeib-verifier/src/test/resources/vectors
          cp -a aeib-native-runtime/aeib-verifier/src/test/resources/vectors release-artifacts/

      - name: Compute Artifact Hashes for SLSA (Base64)
        id: hashes
        run: |
          set -euo pipefail
          FILES=$(find release-artifacts -type f | sort)
          if [[ -z "$FILES" ]]; then
            echo "ERROR: no release artifacts found"
            exit 1
          fi
          HASHES=$(sha256sum $FILES | base64 -w0)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aeib-release-artifacts
          path: release-artifacts/

      - name: Attest SLSA Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release-artifacts/bom.json
            release-artifacts/aeib-verifier/lib/aeib-verifier-1.0.0-rc.3.jar

  verify-receipt-offline:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aeib-release-artifacts
          path: release-artifacts

      - name: Setup Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Standalone Verifier - Valid Receipt (Exit Code 0)
        run: |
          chmod +x release-artifacts/aeib-verifier/bin/aeib-verifier
          set +e
          ./release-artifacts/aeib-verifier/bin/aeib-verifier \
            --receipt release-artifacts/receipt.json \
            --pubkey release-artifacts/ledger-public.pem
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "ERROR: valid receipt failed verification with exit code $status"
            exit 1
          fi
          echo "OK: valid receipt verified with exit code 0"

      - name: Standalone Verifier - Tampered Statement Vector (Exit Code 2)
        run: |
          set +e
          ./release-artifacts/aeib-verifier/bin/aeib-verifier \
            --receipt release-artifacts/vectors/tampered-statement/receipt.json \
            --pubkey release-artifacts/vectors/tampered-statement/public.pem
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "ERROR: tampered statement did not exit with code 2, got: $status"
            exit 1
          fi
          echo "OK: tampered statement rejected with exit code 2"

      - name: Standalone Verifier - Malformed JSON Vector (Exit Code 3)
        run: |
          set +e
          ./release-artifacts/aeib-verifier/bin/aeib-verifier \
            --receipt release-artifacts/vectors/malformed-json/receipt.json \
            --pubkey release-artifacts/vectors/malformed-json/public.pem
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            echo "ERROR: malformed JSON did not exit with code 3, got: $status"
            exit 1
          fi
          echo "OK: malformed JSON rejected with exit code 3"

      - name: Standalone Verifier - Missing File Input (Exit Code 3)
        run: |
          set +e
          ./release-artifacts/aeib-verifier/bin/aeib-verifier \
            --receipt release-artifacts/nonexistent-receipt.json \
            --pubkey release-artifacts/ledger-public.pem
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            echo "ERROR: missing receipt did not exit with code 3, got: $status"
            exit 1
          fi
          echo "OK: missing receipt rejected with exit code 3"

      - name: Standalone Verifier - CLI Usage Error (Exit Code 1)
        run: |
          set +e
          ./release-artifacts/aeib-verifier/bin/aeib-verifier \
            --receipt release-artifacts/receipt.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "ERROR: missing required option did not exit with code 1, got: $status"
            exit 1
          fi
          echo "OK: CLI usage error rejected with exit code 1"

