name: Formal Verification (Lean 4)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'formal-verification/lean/**'
      - '.github/workflows/formal-verification.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'formal-verification/lean/**'

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.0.0

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Lean 4
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/toolchains/leanprover--lean4---v4.0.0/bin" >> $GITHUB_PATH

    - name: Verify Lean toolchain
      working-directory: formal-verification/lean
      run: lean --version

    - name: Build formal verification proofs
      working-directory: formal-verification/lean
      run: lake build

    - name: Check for sorry stubs (must be zero)
      working-directory: formal-verification/lean
      run: |
        SORRY_COUNT=$(grep -r "sorry" --include="*.lean" . 2>/dev/null | wc -l)
        if [ $SORRY_COUNT -gt 0 ]; then
          echo "ERROR: Found $SORRY_COUNT 'sorry' stubs. All lemmas must be proven."
          grep -r "sorry" --include="*.lean" .
          exit 1
        else
          echo "SUCCESS: All 23 lemmas proven (0 sorry stubs found)"
        fi

    - name: Verify lemma count
      working-directory: formal-verification/lean
      run: |
        LEMMA_COUNT=$(grep -r "lemma " --include="*.lean" . 2>/dev/null | grep -v "def " | wc -l)
        echo "Total lemmas found: $LEMMA_COUNT"
        if [ $LEMMA_COUNT -lt 23 ]; then
          echo "WARNING: Expected 23 lemmas, found $LEMMA_COUNT"
        fi

    - name: Summary
      if: success()
      run: |
        echo "=== Formal Verification Summary ==="
        echo "Status: PASSED"
        echo "Phase: 29 - Formal Verification (Lean 4)"
        echo "Expected: 23 lemmas (7 CIPO + 6 GDE + 4 AP2 + 6 Monge Gap)"
        echo "Axioms declared: 1 (sha256_collision_free)"
        echo "Build system: lake (Lean package manager)"
        echo "Lean version: 4.0.0"
