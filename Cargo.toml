[workspace]
resolver = "2"
members = [
    "crates/siss-graph-core",
    "crates/siss-graph-db",
    "crates/siss-gatekeeper",
    "crates/siss-job-router",
    "crates/siss-event-log",
    "crates/siss-context-cartography",
    "crates/siss-behavioral-firewall",
    "crates/siss-feedback-router",
    "crates/siss-agent-shell",
    "crates/siss-agent-card",
    "crates/siss-mcp-gitnexus",
    "crates/siss-enclave",
    "crates/siss-os-sidecar",
    "crates/siss-dispatcher",
    "crates/demo-app",
    "crates/siss-cockpit",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"
regex = "1"
tower           = { version = "0.4", features = ["util"] }
http-body-util  = "0.1"
testcontainers = "0.23"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
axum = { version = "0.7", features = ["json"] }
tokio-stream = "0.1"
async-stream = "0.3"
