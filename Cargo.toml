[workspace]
members = [
  "crates/l0-deterministic-llm",
  "crates/l1-reasoning",
  "crates/l2-knowledge",
  "crates/l3-permit-gates",
  "crates/l4-orchestration",
  "crates/l5-communication",
  "crates/l6-infrastructure",
  "crates/l7-ragas",
  "crates/l8-proof",
  "crates/smaos-qa",
  "crates/siss-compliance", "crates/l2b-federated-consensus", "crates/l9-governance-api", "crates/l10-did-registry", "crates/l11-ap2-settlement",
  "crates/siss-a2a-ipc",
  "crates/siss-a2a-protocol",
  "crates/siss-planner-agent",
  "crates/siss-compliance-agent",
  "crates/siss-evidence-agent",
  "crates/siss-local-llm",
  "crates/siss-chaos-petri",
  "crates/siss-ai-factory",
  "crates/siss-hardware-accel",
  "crates/siss-consensus-extended",
  "crates/siss-agent-pool",
  "crates/siss-otel-bridge",
  "crates/siss-chronicle-drift",
  "crates/siss-robotics-control", "crates/siss-swarm-safety-core", "crates/siss-semantic-cache-compactor", "crates/siss-dag-orchestrator", "crates/siss-cost-optimizer",
  "crates/siss-capsule",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Andrei Leukhin <andrejlo123@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sovreignnexus/smaos"

[workspace.dependencies]
langchain = "0.1"
langgraph = "0.1"
pyo3 = "0.21"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "json"] }
pgvector = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
ed25519-dalek = "2.1"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"
dashmap = "5"
base64 = "0.21"
testcontainers = "0.18"
serde_yaml = "0.9"
futures = "0.3"
regex = "1"
tracing = "0.1"
parking_lot = "0.12"
lru = "0.12"
criterion = "0.5"
