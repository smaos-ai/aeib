[workspace]
members = [
  "crates/l1-reasoning",
  "crates/l2-knowledge",
  "crates/l3-permit-gates",
  "crates/l4-orchestration",
  "crates/l5-communication",
  "crates/l6-infrastructure",
  "crates/l7-ragas",
  "crates/l8-proof",
  "crates/smaos-qa",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Andrei Leukhin <andrejlo123@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sovreignnexus/smaos"

[workspace.dependencies]
langchain = "0.1"
langgraph = "0.1"
pyo3 = "0.21"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "json"] }
pgvector = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
