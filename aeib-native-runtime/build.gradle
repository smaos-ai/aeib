plugins {
    id 'java-library'
    id 'org.cyclonedx.bom' version '1.8.2'
}

allprojects {
    group = 'ai.sovereign.aeib'
    version = '1.0.0-rc.1'

    repositories {
        mavenCentral()
    }

    dependencyLocking {
        lockAllConfigurations()
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

cyclonedxBom {
    includeConfigs = ["runtimeClasspath"]
    schemaVersion = "1.6"
    outputFormat = "json"
    outputName = "bom"
}

tasks.named('cyclonedxBom') {
    doLast {
        def bomFile = file("${buildDir}/reports/bom.json")
        if (bomFile.exists()) {
            bomFile.text = bomFile.text.replaceFirst('"specVersion"\\s*:\\s*"1\\.5"', '"specVersion" : "1.6"')
        }
    }
}

tasks.register('generateSlsaSubjects') {
    dependsOn(':aeib-verifier:installDist', ':aeib-verifier:jar')
    mustRunAfter('cyclonedxBom')
    doLast {
        def outDir = file("${buildDir}/reports/slsa")
        outDir.mkdirs()

        def jarFile = file("aeib-verifier/build/libs/aeib-verifier-${version}.jar")
        def digest = java.security.MessageDigest.getInstance("SHA-256")
            .digest(jarFile.bytes)
            .collect { String.format("%02x", it) }
            .join("")

        def subjectJson = """[
  {
    "name": "aeib-verifier-${version}.jar",
    "digest": { "sha256": "${digest}" }
  }
]"""
        file("${outDir}/subjects.json").text = subjectJson
        file("${outDir}/subjects.base64").text = Base64.encoder.encodeToString(subjectJson.getBytes("UTF-8"))
    }
}
