plugins {
    id 'java-library'
    id 'org.cyclonedx.bom' version '1.8.2'
}

allprojects {
    group = 'ai.sovereign.aeib'
    version = '1.0.0-rc.1'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

cyclonedxBom {
    includeConfigs = ["runtimeClasspath"]
    outputFormat = "json"
    outputName = "bom"
}
