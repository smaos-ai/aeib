# CockroachDB Configuration for Competitive Benchmark
# Tuned for latency (p99 response time) not maximum throughput

[server]
# Default port configuration
port = 26257
http-port = 8080

# Logging
log:
  file-defaults:
    dir: /cockroach/cockroach-data/logs
    max-file-size: 100MB
  sinks:
    stderr:
      filter: WARNING
    file-groups:
      default:
        dir: /cockroach/cockroach-data/logs

[storage]
# Memory usage tuning
cache-size = "8GB"

# Badger KV store optimization
max-ovrflow-value-size = 1MB

[sql]
# Query execution
default-dist-sql-mode = "on"

# Connection pooling
pool-size = 256

# Statement timeout (prevent hanging queries)
statement-timeout = "10m"

[raft]
# Raft consensus tuning for faster failure detection
min-heartbeat-pause = 50ms
max-heartbeat-pause = 300ms
election-timeout = "3s"

# Reduce Raft log I/O overhead
async-snapshot-post-timeout = "100ms"

[rocksdb]
# Write amplification reduction
rate-limit-bytes-per-sec = 0
rate-limit-enabled = false

# SSD optimization
use-direct-reads = true
use-direct-io-for-flush-and-compaction = true

# Key-value store tuning
max-open-files = 40960
block-size = 64KB
compression = "snappy"

[kv]
# Transaction processing
batch-size = "64KB"
raft-apply-batch-size = 100
raft-tick-interval = "100ms"

# Reduce lock contention
max-raft-log-size = 64MB

[debug]
# Disable expensive debug checks
disable-raft-log-queue = false
