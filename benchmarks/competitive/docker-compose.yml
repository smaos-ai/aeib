version: '3.9'

services:
  # CockroachDB
  cockroachdb:
    image: cockroachdb/cockroach:latest
    container_name: cockroachdb_benchmark
    command: start-single-node --insecure
    ports:
      - "26257:26257"       # PostgreSQL wire protocol (SQL)
      - "8080:8080"         # Admin UI
    environment:
      - GOGC=80             # Aggressive garbage collection
      - TZ=UTC
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '10.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - benchmark_network

  # TiDB (distributed database)
  tidb:
    image: pingcap/tidb:latest
    container_name: tidb_benchmark
    ports:
      - "4000:4000"         # MySQL-compatible protocol
      - "10080:10080"       # Status/metrics port
    environment:
      - TZ=UTC
    volumes:
      - tidb_data:/data
      - ./tidb.conf:/tidb.conf:ro
    command:
      - --config=/tidb.conf
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '10.0'
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4000"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - benchmark_network

  # EdgeDB (graph database)
  edgedb:
    image: edgedb/edgedb:latest
    container_name: edgedb_benchmark
    ports:
      - "5656:5656"         # EdgeQL protocol
    environment:
      - EDGEDB_PORT=5656
      - EDGEDB_ADMIN_UI=true
    volumes:
      - edgedb_data:/var/lib/edgedb
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '10.0'
    healthcheck:
      test: ["CMD", "edgedb", "query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - benchmark_network

  # Prometheus (metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_benchmark
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - benchmark_network
    depends_on:
      - cockroachdb
      - tidb
      - edgedb

  # Grafana (visualization dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_benchmark
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sovereignnexus2026
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - benchmark_network
    depends_on:
      - prometheus

  # nginx (reverse proxy for convenience)
  nginx:
    image: nginx:latest
    container_name: nginx_benchmark
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - benchmark_network
    depends_on:
      - prometheus
      - grafana

volumes:
  cockroach_data:
    driver: local
  tidb_data:
    driver: local
  edgedb_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  benchmark_network:
    driver: bridge
