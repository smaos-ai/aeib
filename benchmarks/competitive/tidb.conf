# TiDB Configuration for Competitive Benchmark
# Tuned for latency (p99 response time) not maximum throughput

[server]
# Network configuration
port = 4000
status-port = 10080
grpc-keepalive-time = 10s
grpc-keepalive-timeout = 3s
grpc-concurrency-limit = 256

[performance]
# Query execution tuning
committer-concurrency = 16
max-txn-ttl = 30m
max-batch-client = 128

# Reduce commit latency
tcp-no-delay = true

[storage]
# Engine tuning for SSD (M3 Pro uses NVMe)
block-cache-size = "8GB"
block-size = 64KB

# RocksDB settings
compression = "lz4"
compression-level = 5

# Key-value store optimization
# Reduce write amplification
max-background-compactions = 8
max-background-flushes = 4

[raftstore]
# Raft consensus tuning
# Faster heartbeats = faster failure detection
raft-heartbeat-ticks = 10
raft-election-timeout-ticks = 50
raft-store-max-leader-lease = "9s"

# Improve latency
peer-stale-state-check-interval = "5m"

[log]
# Minimal logging overhead
format = "json"
level = "warn"
enable-slow-log = false
slow-threshold = 300

[rocksdb]
# RocksDB specific tuning
max-open-files = 40960
compaction-style = "level"

# SSD optimized
use-direct-reads = true
use-direct-io-for-flush-and-compaction = true

# Aggressive compaction
level0-file-num-compaction-trigger = 4
level0-slowdown-writes-trigger = 20
level0-stop-writes-trigger = 36
