[package]
name = "aeib-data-plane"
version = "1.0.0-rc.5"
edition = "2021"
description = "Station 1 native data plane: branchless CAID + io_uring group-commit WAL"
license = "Apache-2.0"

[dependencies]
anyhow = { workspace = true }
ed25519-dalek = { version = "2.1", features = ["alloc", "zeroize", "rand_core"] }
hex = { workspace = true }
libc = "0.2"
rand = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.5"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "full"] }
zeroize = { version = "1.7", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.4"

[dev-dependencies]
criterion = { workspace = true }
rand = "0.8"

[[bench]]
name = "stochastic_saga"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

