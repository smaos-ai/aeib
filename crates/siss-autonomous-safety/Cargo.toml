[package]
name = "siss-autonomous-safety"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4"
dashmap = "5.5"
hex = "0.4"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
siss-swarm-consensus = { path = "../siss-swarm-consensus" }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
