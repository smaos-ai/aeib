<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISS Cockpit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #1a1a2e;
      border-bottom: 1px solid #333;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 18px; color: #7eb8f7; letter-spacing: 0.05em; }

    #sse-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 3px;
      background: #333;
      color: #aaa;
    }
    #sse-status.connected { background: #1a3a1a; color: #4caf50; }
    #sse-status.error     { background: #3a1a1a; color: #f44336; }

    main {
      display: grid;
      grid-template-columns: 1fr 340px;
      overflow: hidden;
    }

    /* ── Event Log ── */
    #log-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222;
      overflow: hidden;
    }

    #log-panel h2 {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 0.1em;
      padding: 10px 16px;
      border-bottom: 1px solid #222;
    }

    #event-log {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .log-entry {
      padding: 6px 16px;
      border-bottom: 1px solid #1a1a1a;
      display: grid;
      grid-template-columns: 120px 140px 1fr;
      gap: 8px;
      align-items: start;
      font-size: 12px;
      transition: background 0.15s;
    }
    .log-entry:hover { background: #1a1a1a; }

    .log-entry.form_submitted {
      background: #1a1a00;
      border-left: 3px solid #f0c040;
    }

    .log-timestamp { color: #666; white-space: nowrap; }
    .log-type      { color: #7eb8f7; font-weight: bold; }
    .log-body      { color: #ccc; word-break: break-all; }
    .log-agent-id  { color: #9e7ef7; font-size: 10px; }

    /* ── Agent Panels ── */
    #agents-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #agents-panel h2 {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 0.1em;
      padding: 10px 16px;
      border-bottom: 1px solid #222;
    }

    #agents-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .agent-card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      margin-bottom: 8px;
      padding: 10px;
    }

    .agent-card .agent-id {
      font-size: 10px;
      color: #9e7ef7;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .agent-card .agent-status {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
    }

    .agent-controls { display: flex; gap: 6px; }

    .agent-controls button {
      flex: 1;
      padding: 5px 4px;
      border: none;
      border-radius: 3px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .agent-controls button:hover { opacity: 0.8; }
    .agent-controls button:active { opacity: 0.6; }

    .btn-pause  { background: #b8860b; color: #fff; }
    .btn-resume { background: #2e7d32; color: #fff; }
    .btn-abort  { background: #b71c1c; color: #fff; }

    .feedback {
      font-size: 10px;
      color: #aaa;
      margin-top: 5px;
      min-height: 14px;
    }
    .feedback.ok  { color: #4caf50; }
    .feedback.err { color: #f44336; }
  </style>
</head>
<body>
  <header>
    <h1>SISS Cockpit</h1>
    <span id="sse-status">connecting…</span>
  </header>

  <main>
    <section id="log-panel">
      <h2>Event Log</h2>
      <div id="event-log"></div>
    </section>

    <aside id="agents-panel">
      <h2>Agents</h2>
      <div id="agents-list"></div>
    </aside>
  </main>

  <script>
    const statusEl   = document.getElementById('sse-status');
    const logEl      = document.getElementById('event-log');
    const agentsEl   = document.getElementById('agents-list');

    // ── SSE connection ──────────────────────────────────────────────
    const es = new EventSource('/api/agents/stream');

    es.onopen = () => {
      statusEl.textContent = 'connected';
      statusEl.className   = 'connected';
    };

    es.onerror = () => {
      statusEl.textContent = 'disconnected';
      statusEl.className   = 'error';
    };

    es.onmessage = (e) => {
      let event;
      try { event = JSON.parse(e.data); } catch (_) { return; }
      appendLogEntry(event);
      if (event.agent_id) upsertAgentPanel(event.agent_id, event.event_type);
    };

    // ── Event log ───────────────────────────────────────────────────
    function appendLogEntry(event) {
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + (event.event_type || '');

      const ts = event.timestamp
        ? new Date(event.timestamp).toLocaleTimeString()
        : '--';

      const agentShort = event.agent_id
        ? '<span class="log-agent-id">' + event.agent_id.slice(0, 8) + '…</span> '
        : '';

      const payloadStr = event.payload !== undefined
        ? JSON.stringify(event.payload, null, 0)
        : '';

      entry.innerHTML =
        '<span class="log-timestamp">' + escapeHtml(ts)              + '</span>' +
        '<span class="log-type">'      + escapeHtml(event.event_type || '') + '</span>' +
        '<span class="log-body">'      + agentShort + escapeHtml(payloadStr) + '</span>';

      logEl.appendChild(entry);
      // Keep log scrolled to bottom
      logEl.scrollTop = logEl.scrollHeight;

      // Cap log at 500 entries to avoid memory bloat
      while (logEl.children.length > 500) {
        logEl.removeChild(logEl.firstChild);
      }
    }

    // ── Agent panels ────────────────────────────────────────────────
    function upsertAgentPanel(agentId, lastEventType) {
      let card = document.getElementById('agent-' + agentId);
      if (!card) {
        card = document.createElement('div');
        card.className = 'agent-card';
        card.id = 'agent-' + agentId;
        card.innerHTML =
          '<div class="agent-id">' + escapeHtml(agentId) + '</div>' +
          '<div class="agent-status">active</div>' +
          '<div class="agent-controls">' +
            '<button class="btn-pause"  onclick="agentAction(\'' + agentId + '\',\'pause\')">Pause</button>'  +
            '<button class="btn-resume" onclick="agentAction(\'' + agentId + '\',\'resume\')">Resume</button>' +
            '<button class="btn-abort"  onclick="agentAction(\'' + agentId + '\',\'abort\')">Abort</button>'  +
          '</div>' +
          '<div class="feedback" id="fb-' + agentId + '"></div>';
        agentsEl.prepend(card);
      }

      // Update status label from last event
      const statusMap = {
        agent_paused:   'paused',
        agent_resumed:  'active',
        agent_aborted:  'aborted',
        form_submitted: 'awaiting input',
      };
      const statusEl2 = card.querySelector('.agent-status');
      if (statusEl2 && statusMap[lastEventType]) {
        statusEl2.textContent = statusMap[lastEventType];
      }
    }

    // ── Control actions ─────────────────────────────────────────────
    function agentAction(agentId, action) {
      const fbEl = document.getElementById('fb-' + agentId);
      if (fbEl) { fbEl.textContent = '…'; fbEl.className = 'feedback'; }

      fetch('/api/agents/' + agentId + '/' + action, { method: 'POST' })
        .then(r => {
          if (fbEl) {
            fbEl.textContent = action + ' accepted';
            fbEl.className   = 'feedback ok';
          }
        })
        .catch(err => {
          if (fbEl) {
            fbEl.textContent = 'error: ' + err.message;
            fbEl.className   = 'feedback err';
          }
        });
    }

    // ── Helpers ─────────────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
