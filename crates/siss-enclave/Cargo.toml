[package]
name = "siss-enclave"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "json"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
atomic = "0.1"
async-trait = "0.1"
axum = "0.7"
anyhow = "1"
reqwest = { version = "0.11", features = ["json"] }

siss-graph-db = { path = "../siss-graph-db" }
siss-agent-card = { path = "../siss-agent-card" }

[dev-dependencies]
testcontainers = "0.23"
