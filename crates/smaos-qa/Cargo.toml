[package]
name = "smaos-qa"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
sha2 = "0.10"
ed25519-dalek = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.0"
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }

[[bin]]
name = "smaos-qa"
path = "src/main.rs"

[lib]
name = "smaos_qa"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
