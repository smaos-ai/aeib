apiVersion: v1
kind: Service
metadata:
  name: phase2c-app
  namespace: default
  labels:
    app: phase2c
spec:
  type: ClusterIP
  selector:
    app: phase2c
  ports:
  - name: api
    port: 5173
    targetPort: 5173
    protocol: TCP
  - name: ollama
    port: 11434
    targetPort: 11434
    protocol: TCP
  - name: metrics
    port: 9000
    targetPort: 9000
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: phase2c-app-external
  namespace: default
  labels:
    app: phase2c
spec:
  type: LoadBalancer
  selector:
    app: phase2c
  ports:
  - name: api
    port: 80
    targetPort: 5173
    protocol: TCP
