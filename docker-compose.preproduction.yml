version: '3.9'

# ═════════════════════════════════════════════════════════════════════════
# SovereignNexus Pre-Production Orchestration
# Full SMAOS Phase 1 stack: Harness + Database + Models + Monitoring
#
# USAGE:
#   docker-compose -f docker-compose.preproduction.yml up -d
#   docker-compose -f docker-compose.preproduction.yml logs -f harness
#
# REQUIREMENTS:
#   - Docker 20.10+ (compose v2+)
#   - Docker GPU support (nvidia-docker / docker daemon with GPU)
#   - 32GB RAM recommended (16GB minimum)
#   - RTX 4060+ (8GB VRAM) or equivalent GPU
#   - 50GB free disk space (models + database)
# ═════════════════════════════════════════════════════════════════════════

services:

  # ═════════════════════════════════════════════════════════════════════
  # 1. POSTGRESQL + PGVECTOR (Knowledge Graph Layer L2)
  # ═════════════════════════════════════════════════════════════════════
  postgresql:
    image: pgvector/pgvector:pg15-latest
    container_name: smaos-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smaos_phase1
      POSTGRES_USER: smaos
      POSTGRES_PASSWORD: "${DB_PASSWORD:-smaos-dev-unsafe}" # MUST change in production
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c effective_cache_size=1GB"
    restart: always
    networks:
      - smaos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smaos -d smaos_phase1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - postgresql-logs:/var/log/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  # ═════════════════════════════════════════════════════════════════════
  # 2. SMAOS HARNESS (L1-L8 Policy Router + Orchestration)
  # ═════════════════════════════════════════════════════════════════════
  harness:
    build:
      context: .
      dockerfile: Dockerfile.preproduction
    container_name: smaos-harness
    ports:
      - "8080:8080"  # Main API
      - "9999:9999"  # Checkpoint stream (L4)
    environment:
      # Database
      DATABASE_URL: "postgresql://smaos:${DB_PASSWORD:-smaos-dev-unsafe}@postgresql:5432/smaos_phase1"
      DB_POOL_SIZE: "20"
      DB_STATEMENT_CACHE_SIZE: "100"

      # Model Serving (FreeToken)
      FREETOKEN_ENDPOINT: "http://freetoken:8001"
      OLLAMA_ENDPOINT: "http://ollama:11434"
      MODEL_NAME: "qwen2.5:7b"
      EMBEDDING_MODEL: "nomic-embed-text"

      # Logging & Observability
      RUST_LOG: "info,smaos=debug,l4=debug,l7=debug,l8=debug"
      LOG_DIR: "/var/log/smaos"
      LOG_LEVEL: "info"

      # Feature Flags
      ENABLE_PROOF_LAYER: "true"
      ENABLE_MCP_SERVERS: "true"
      ENABLE_RAGAS_EVAL: "true"
      ENABLE_PROMETHEUS_METRICS: "true"

      # Checkpoint Configuration
      CHECKPOINT_DIR: "/var/lib/smaos/checkpoints"
      CHECKPOINT_INTERVAL_MS: "1000"

      # Timeouts
      DECISION_TIMEOUT_MS: "5000"
      DB_QUERY_TIMEOUT_MS: "2000"

      # Security
      ENABLE_TLS: "false"  # Set to true for production
      CORS_ORIGINS: "http://localhost:3000,http://dashboard:3000"

      # Cluster Mode (Phase 2 preparation)
      CLUSTER_ENABLED: "false"
      NODE_ID: "primary-01"

    restart: always
    networks:
      - smaos-network
    depends_on:
      postgresql:
        condition: service_healthy
      ollama:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - smaos-logs:/var/log/smaos
      - smaos-checkpoints:/var/lib/smaos/checkpoints
      - smaos-proofs:/var/lib/smaos/proofs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits for stability
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ═════════════════════════════════════════════════════════════════════
  # 3. OLLAMA (Local Model Serving — L6 Infrastructure)
  # ═════════════════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: smaos-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "30m"
    restart: always
    networks:
      - smaos-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ollama-models:/root/.ollama/models
      - ollama-logs:/var/log/ollama
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # GPU support (nvidia-docker required)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']  # Use GPU 0 (adjust if multiple GPUs)
              capabilities: [gpu]
    # Post-start: Pull models
    command: >
      sh -c "ollama serve &
      sleep 10 &&
      ollama pull qwen2.5:7b &&
      ollama pull nomic-embed-text &&
      wait"

  # ═════════════════════════════════════════════════════════════════════
  # 4. FREETOKEN (Optimized Local Inference — Optional, 3-4x faster)
  # ═════════════════════════════════════════════════════════════════════
  freetoken:
    build:
      context: .
      dockerfile: Dockerfile.freetoken
    container_name: smaos-freetoken
    ports:
      - "8001:8001"
    environment:
      FREETOKEN_HOST: "0.0.0.0"
      FREETOKEN_PORT: "8001"
      MODEL_NAME: "Qwen/Qwen2.5-7B-Instruct"
      MAX_TOKENS: "4096"
      BATCH_SIZE: "1"
      CUDA_VISIBLE_DEVICES: "0"
    restart: always
    networks:
      - smaos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - freetoken-models:/root/.cache/huggingface
      - freetoken-logs:/var/log/freetoken
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  # ═════════════════════════════════════════════════════════════════════
  # 5. PROMETHEUS (Metrics Collection & Time-Series Storage)
  # ═════════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: smaos-prometheus
    ports:
      - "9090:9090"
    environment:
      TZ: UTC
    restart: always
    networks:
      - smaos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      - prometheus-logs:/var/log/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
      - "--query.timeout=30s"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ═════════════════════════════════════════════════════════════════════
  # 6. GRAFANA (Monitoring Dashboard + Real-time Proof Trail)
  # ═════════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.2.0
    container_name: smaos-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin-unsafe}"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
      GF_LOG_LEVEL: info
    restart: always
    networks:
      - smaos-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - grafana-storage:/var/lib/grafana
      - grafana-logs:/var/log/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ═════════════════════════════════════════════════════════════════════
  # 7. JAEGER (Distributed Tracing — L5 Communication Insights)
  # ═════════════════════════════════════════════════════════════════════
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: smaos-jaeger
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # gRPC receiver
      - "4317:4317"    # OTLP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "badger"
      BADGER_EPHEMERAL: "false"
    restart: always
    networks:
      - smaos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - jaeger-data:/badger/data
      - jaeger-logs:/var/log/jaeger
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ═════════════════════════════════════════════════════════════════════
  # 8. VAULT (Secret Management — Production Keys & Credentials)
  # ═════════════════════════════════════════════════════════════════════
  vault:
    image: vault:1.15
    container_name: smaos-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_TOKEN:-dev-token-unsafe}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: info
    restart: always
    networks:
      - smaos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - vault-data:/vault/data
      - vault-logs:/var/log/vault
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    command: vault server -dev

  # ═════════════════════════════════════════════════════════════════════
  # 9. REDIS (Session Cache — Optional, for Phase 2 scaling)
  # ═════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: smaos-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - smaos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# ═════════════════════════════════════════════════════════════════════
# NETWORKS
# ═════════════════════════════════════════════════════════════════════
networks:
  smaos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ═════════════════════════════════════════════════════════════════════
# VOLUMES (Persistent Storage)
# ═════════════════════════════════════════════════════════════════════
volumes:
  postgresql-data:
    driver: local
  postgresql-logs:
    driver: local
  ollama-models:
    driver: local
  ollama-logs:
    driver: local
  freetoken-models:
    driver: local
  freetoken-logs:
    driver: local
  smaos-logs:
    driver: local
  smaos-checkpoints:
    driver: local
  smaos-proofs:
    driver: local
  prometheus-data:
    driver: local
  prometheus-logs:
    driver: local
  grafana-storage:
    driver: local
  grafana-logs:
    driver: local
  jaeger-data:
    driver: local
  jaeger-logs:
    driver: local
  vault-data:
    driver: local
  vault-logs:
    driver: local
  redis-data:
    driver: local
