services:
  # ═════════════════════════════════════════════════════════════
  # 1. VISION API (Python FastAPI) — Governance decisions + Merkle proofs
  # ═════════════════════════════════════════════════════════════
  vision-api:
    build:
      context: ./services/planet-dashboard
      dockerfile: Dockerfile.vision-api
    container_name: sovereign-vision-api
    ports:
      - "8000:8000"
    environment:
      PYTHON_ENV: production
      LOG_LEVEL: info
      WORKERS: 4
    restart: always
    networks:
      - sovereign-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - vision-api-logs:/var/log/vision-api
      - ./services/planet-dashboard:/app
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # ═════════════════════════════════════════════════════════════
  # 2. NEXT.JS DASHBOARD (Node.js) — Governance UI + Real-time SSE
  # ═════════════════════════════════════════════════════════════
  dashboard:
    build:
      context: ./services/siss-dashboard
      dockerfile: Dockerfile
    container_name: sovereign-dashboard
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    restart: always
    networks:
      - sovereign-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - dashboard-logs:/var/log/dashboard
      - ./services/siss-dashboard/.next:/app/.next
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      vision-api:
        condition: service_healthy

  # ═════════════════════════════════════════════════════════════
  # 3. FREETOKEN (Local LLM) — 39.3 tok/s on 8GB (3-4x faster than Ollama)
  # ═════════════════════════════════════════════════════════════
  freetoken:
    build:
      context: .
      dockerfile: Dockerfile.freetoken
    container_name: sovereign-freetoken
    ports:
      - "8001:8001"
    environment:
      FREETOKEN_HOST: 0.0.0.0
      FREETOKEN_PORT: 8001
      MODEL_NAME: Qwen/Qwen2.5-32B-Instruct
      MAX_TOKENS: 4096
      CUDA_VISIBLE_DEVICES: 0
    restart: always
    networks:
      - sovereign-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - freetoken-models:/root/.cache/huggingface
      - freetoken-logs:/var/log/freetoken
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ═════════════════════════════════════════════════════════════
  # 4. VAULT (Secret Management) — OIDC + Multi-cloud
  # ═════════════════════════════════════════════════════════════
  vault:
    image: hashicorp/vault:latest
    container_name: sovereign-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: sovereign-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: info
    restart: always
    networks:
      - sovereign-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - vault-data:/vault/data
      - vault-logs:/var/log/vault
      - ./vault-config.hcl:/vault/config/vault.hcl
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    command: vault server -config=/vault/config/vault.hcl

  # ═════════════════════════════════════════════════════════════
  # 5. PROMETHEUS (Metrics + OpenTelemetry) — OT trace aggregation
  # ═════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: sovereign-prometheus
    ports:
      - "9090:9090"
    environment:
      TZ: UTC
    restart: always
    networks:
      - sovereign-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
      - prometheus-logs:/var/log/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ═════════════════════════════════════════════════════════════
  # 6. JAEGER (Distributed Tracing) — LocalJaeger backend
  # ═════════════════════════════════════════════════════════════
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: sovereign-jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    restart: always
    networks:
      - sovereign-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - jaeger-data:/badger/data
      - jaeger-key:/badger/key
      - jaeger-logs:/var/log/jaeger
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  sovereign-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  vision-api-logs:
  dashboard-logs:
  freetoken-models:
  freetoken-logs:
  vault-data:
  vault-logs:
  prometheus-data:
  prometheus-logs:
  jaeger-data:
  jaeger-key:
  jaeger-logs:
