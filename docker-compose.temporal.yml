version: '3.8'

services:
  temporal-db:
    image: postgres:14-alpine
    container_name: sovereign-temporal-db
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    restart: always
    networks:
      - sovereign-network
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-server:
    image: temporalio/server:latest
    container_name: sovereign-temporal-server
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      LOG_LEVEL: info
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yml
    restart: always
    networks:
      - sovereign-network
    ports:
      - "7233:7233"
      - "7234:7234"
      - "7235:7235"
      - "7239:7239"
    depends_on:
      temporal-db:
        condition: service_healthy
    volumes:
      - ./temporal-config.yml:/etc/temporal/config/dynamicconfig.yml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7234/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  temporal-ui:
    image: temporalio/ui:latest
    container_name: sovereign-temporal-ui
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
    restart: always
    networks:
      - sovereign-network
    depends_on:
      - temporal-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  sovereign-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  temporal-db-data:
