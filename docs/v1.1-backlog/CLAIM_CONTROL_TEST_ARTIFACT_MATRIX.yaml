# docs/v1.1-backlog/CLAIM_CONTROL_TEST_ARTIFACT_MATRIX.yaml
# ==============================================================================
# AEIB Track B (v1.1) Claim–Control–Test–Artifact Matrix
#
# Epistemic Notice (AGENTS.md §1 & §5):
#   Operates under the stated model. All claims require correlated empirical evidence
#   and cryptographic trace logs. Tests remain in state NOT_RUN until executed and
#   populated with exact commit SHA, container digest, observed behavior, and signed receipts.
# ==============================================================================

matrix_version: "1.1.0-rc.1"
baseline_commit: "2a36f2c34d55cd32d11ab49928fd683056df0909"
active_branch: "feat/v1.1-temporal-standing"
last_updated: "2026-10-15T13:35:00Z"

epistemic_invariants:
  - id: "INV-PREVENT-01"
    name: "pre_execution_prevention"
    principle: "A working execution boundary must prevent what should not happen before external socket allocation, not merely record a post-hoc log."
  - id: "INV-HALT-02"
    name: "stage_dependent_halt"
    principle: "A halt must be enforced at the execution boundary across all 3 stages and must never retroactively relabel an ambiguous wire attempt as NOT_DISPATCHED."
  - id: "INV-BINDING-03"
    name: "exact_action_binding"
    principle: "The execution-bound JCS CAID binds all consequential fields (amount, recipient, target, currency). PII masking is applied strictly at the operator-facing brief presentation layer."
  - id: "INV-RECON-04"
    name: "target_evidence_contract"
    principle: "Target state reconciliation requires an authenticated, operation-bound status endpoint. MARK_FAILED is conditional on target evidence proving absence or reversal."

