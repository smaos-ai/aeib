\* NEGATIVE CONTROL: A4 trusts a NOT_APPLIED read-back (no fence). TLC is expected to REPORT a
\* violation of SafetyNoDuplicateEffect (the late-commit counterexample). A gate that does not
\* find it would mean the model or the checker is not exercising late commits.
SPECIFICATION Spec
CONSTANTS
    Operations = {op1, op2}
    SprintLimitMinor = 3
    MaxPerCallMinor = 2
    FencingEnabled = FALSE
INVARIANTS
    TypeOK
    SafetyBudgetConservation
    SafetyEscrowIdentity
    SafetyNoDuplicateEffect
    SafetyNeverReleaseLatchWithoutReadback
    SafetyF7StaysIndeterminate
CHECK_DEADLOCK FALSE
