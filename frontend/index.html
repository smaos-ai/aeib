<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMAOS Osiris Cockpit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Monaco', 'Courier New', monospace;
      background: #0a0e27;
      color: #e0e0e0;
      overflow: hidden;
    }
    #root { width: 100vw; height: 100vh; }

    /* Accessibility: Focus indicators */
    button:focus-visible,
    [role="button"]:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }

    /* Accessibility: Improve color contrast */
    .gauge-label,
    .panel-header {
      color: #c5c5c5 !important; /* Improved from #a0a0a0 - ratio 5.7:1 vs 4.2:1 */
    }

    /* Accessibility: Enhanced focus for navigation */
    a:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Accessibility: Ensure dialog styling */
    dialog {
      background: inherit;
      border: inherit;
      padding: inherit;
    }

    /* Accessibility: Better keyboard navigation visual feedback */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Accessibility: High contrast mode support */
    @media (prefers-contrast: more) {
      body {
        color: #ffffff;
      }
      button {
        border-width: 2px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
