[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeib"
version = "0.1.0"
description = "Agent-Effect Integrity Benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "AEIB Working Group" }
]
keywords = ["agents", "verification", "benchmark", "invariants"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.scripts]
aeib-run = "runner.reference_runner:main"
aeib-verify = "runner.verifier:main"
