version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arxiv-postgres
    environment:
      POSTGRES_DB: arxiv_db
      POSTGRES_USER: arxiv_user
      POSTGRES_PASSWORD: arxiv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arxiv_user -d arxiv_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
