spring.application.name=code-ingestion-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/siss_knowledge
spring.datasource.username=siss_user
spring.datasource.password=siss_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false

logging.level.root=INFO
logging.level.ai.sovereign.code=DEBUG
