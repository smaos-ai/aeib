version: '3.9'

services:
  vision-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vision-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./logs:/app/logs
    networks:
      - vision-network

networks:
  vision-network:
    driver: bridge
