# Egress Control Whitelist Policies
# Per-pilot destinations for hotel, glass, and school pilots
# EU AI Act compliance: Article 6 (High-risk) + Annex I/III

pilots:

  # PILOT 1: Hotel Credit Scoring
  # Use case: Agent calls credit bureaus, sanctions databases, policy APIs
  # Risk level: HIGH (affects financial essential service)
  # Articles: 50 (transparency), 51 (GPAI), 14 (accuracy documentation)
  hotel:
    description: "Hotel credit scoring pilot - calls credit bureaus and compliance APIs"
    rate_limit_per_minute: 10
    allowed_domains:
      # Credit Bureaus (US)
      - equifax.com
      - www.equifax.com
      - experian.com
      - www.experian.com
      - transunion.com
      - www.transunion.com

      # EU AI Act Compliance APIs
      - ec.europa.eu
      - www.ec.europa.eu
      - aiact.ec.europa.eu

      # Sanctions/PEP Checking
      - ofac.treasury.gov
      - api.worldcompliance.com

      # Policy Documentation
      - europa.eu
      - www.europa.eu

      # Internal compliance backend
      - compliance.sovereignnexus.io
      - api.sovereignnexus.io

    allowed_patterns:
      # Match any *.equifax.com subdomain
      - ".*\\.equifax\\.com"
      # Match any *.experian.com subdomain
      - ".*\\.experian\\.com"
      # Match any *.ec.europa.eu subdomain
      - ".*\\.ec\\.europa\\.eu"
      # Match any sovereignnexus.io domain
      - ".*\\.sovereignnexus\\.io"

    critical_apis:
      # Domains requiring TLS certificate pinning
      equifax.com: "sha256/ABCD1234..."  # placeholder
      experian.com: "sha256/EFGH5678..."  # placeholder
      transunion.com: "sha256/IJKL9012..." # placeholder

  # PILOT 2: Glass Safety Review
  # Use case: Agent retrieves CAD models, safety standards, engineering specs
  # Risk level: HIGH (affects product safety)
  # Articles: 6 (high-risk), 13 (documentation), 14 (robustness)
  glass:
    description: "Glass defect detection pilot - calls CAD repos and safety databases"
    rate_limit_per_minute: 15
    allowed_domains:
      # CAD/Engineering Repositories
      - github.com
      - www.github.com
      - gitlab.com
      - www.gitlab.com
      - bitbucket.org
      - www.bitbucket.org

      # Safety Standards Databases
      - astm.org
      - www.astm.org
      - iso.org
      - www.iso.org
      - nist.gov
      - www.nist.gov

      # Material Databases
      - matweb.com
      - www.matweb.com
      - matmatch.com
      - www.matmatch.com

      # CAD Model Repositories (FOSS)
      - thingiverse.com
      - www.thingiverse.com

      # Internal glass pilot backend
      - glass.sovereignnexus.io
      - api.sovereignnexus.io

    allowed_patterns:
      # GitHub organization patterns
      - "api\\.github\\.com"
      - "raw\\.githubusercontent\\.com"
      # GitLab patterns
      - ".*\\.gitlab\\.com"
      # Internal APIs
      - ".*\\.sovereignnexus\\.io"

    critical_apis:
      github.com: "sha256/GITHUB1234..."  # placeholder
      gitlab.com: "sha256/GITLAB5678..."  # placeholder
      nist.gov: "sha256/NIST9012..."      # placeholder

  # PILOT 3: School Access Control
  # Use case: Agent queries FERPA compliance APIs, student record systems
  # Risk level: HIGH (affects minors and education)
  # Articles: 6 (high-risk), 50 (transparency), 14 (robustness)
  school:
    description: "School access control pilot - calls FERPA APIs and education databases"
    rate_limit_per_minute: 8
    allowed_domains:
      # US Department of Education
      - ed.gov
      - www.ed.gov
      - fsec.ed.gov

      # FERPA Compliance Resources
      - studentprivacy.ed.gov
      - www.studentprivacy.ed.gov

      # Student Information Systems (SIS)
      - powerschool.com
      - www.powerschool.com
      - skyward.com
      - www.skyward.com

      # Educational Standards
      - ccsso.org
      - www.ccsso.org

      # Internal school pilot backend
      - school.sovereignnexus.io
      - api.sovereignnexus.io

    allowed_patterns:
      # .edu domains (accredited schools/universities)
      - ".*\\.edu"
      # Department of Education subdomains
      - ".*\\.ed\\.gov"
      # State education agencies
      - ".*\\.doe\\..*"
      # Internal APIs
      - ".*\\.sovereignnexus\\.io"

    critical_apis:
      ed.gov: "sha256/DOED1234..."          # placeholder
      studentprivacy.ed.gov: "sha256/STUD5678..."  # placeholder

# Global rate limiting defaults (can be overridden per pilot)
global:
  default_rate_limit_per_minute: 10
  dns_cache_ttl_seconds: 3600
  tls_validation_timeout_seconds: 5
  rate_limit_window_seconds: 60

# Blocked destinations (explicit deny list)
# These override allow list if explicitly blocked
blocked_destinations:
  - "localhost"
  - "127.0.0.1"
  - "0.0.0.0"
  - "169.254.*"  # Link-local addresses
  - "192.168.*"  # Private networks
  - "10.0.0.0/8" # Private networks
  - "172.16.0.0/12"  # Private networks

# Audit trail settings
audit:
  log_all_attempts: true
  log_blocked_attempts: true
  log_rate_limited_attempts: true
  retention_days: 90
  format: json
