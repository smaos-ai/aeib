schema_version: "1.0.0-stpa-aeib"
register_id: "aeib-stpa-hazard-register-2026-10"
methodology: "STPA (Systems-Theoretic Process Analysis) + VEPA / ICSE-2026 Tool-Safety Mapping"
references:
  - "arXiv:2601.08012v1 (Towards Verifiably Safe Tool Use for LLM Agents)"
  - "arXiv:2610.12813v1 (VEPA: Verified Evolving Formal Policy for Lifelong LLM Agent Guardrails)"
  - "arXiv:2609.38266v1 (Janus: Evidence-Before-Effect Sagas and Offline-Verifiable Provenance)"
  - "arXiv:2610.09793v1 (Formal Runtime Verification for Tool-Using LLM Agents)"
  - "arXiv:2609.27900v1 (Delegated Misalignment: How Multi-Agent Structures Amplify LLM Safety Risks)"
  - "arXiv:2610.28667v1 (Who Verifies the Builder? Toward Independent Assurance)"

hazards:
  - hazard_id: "H-01"
    name: "duplicate_payment"
    unsafe_control_action: "Agent re-dispatches a mutating financial or state-changing tool call after transport timeout or crash without knowing whether the prior call committed."
    causal_scenario: "Timeout ambiguity on wire call; naive retry loop re-sends identical payload."
    enforced_control: "PreDispatchIntentInterlock + 3-state crash ambiguity classifier (DISPATCH_MAY_HAVE_STARTED sets retry_allowed=False and latches CAID until out-of-band reconciliation)."
    halt_code: "HALT_AMBIGUOUS_DISPATCH_RETRY_FORBIDDEN"
    verification_test: "tests/test_oct2026_runtime_trace_contextcart_and_hazard_gate.py::test_crash_ambiguity_three_states_and_duplicate_payment_block"

  - hazard_id: "H-02"
    name: "post_approval_substitution"
    unsafe_control_action: "Agent obtains human/verifier approval for a benign action (e.g., refund 100 minor units or tool 'refund_api_v1') and substitutes a mutated payload (1,000,000 minor units) or different tool ('wire_transfer_v1') at dispatch."
    causal_scenario: "Approval check validates boolean approval flag rather than binding canonical_act_digest and tool_id."
    enforced_control: "JanusOfflineSagaLogVerifier binds Ed25519-signed approval_digest to canonical_act_digest and tool_id prior to side-effect release."
    halt_code: "HALT_POST_APPROVAL_SUBSTITUTION"
    verification_test: "tests/test_oct2026_runtime_trace_contextcart_and_hazard_gate.py::test_janus_offline_verifier_catches_post_approval_substitution"

  - hazard_id: "H-03"
    name: "secret_leakage"
    unsafe_control_action: "Agent environment or trace serializer exposes raw API credentials, bearer tokens, or private keys in tool arguments or active context."
    causal_scenario: "Credentials injected inside sandboxed guest process rather than at host egress proxy, or logged unredacted."
    enforced_control: "StpaHazardRegisterGate scans outbound tool payloads and trace records for raw credential patterns before egress or archival."
    halt_code: "HALT_SECRET_LEAKAGE_DETECTED"
    verification_test: "tests/test_oct2026_runtime_trace_contextcart_and_hazard_gate.py::test_stpa_hazard_register_controls_and_secret_leakage_halt"

  - hazard_id: "H-04"
    name: "prompt_injection_escalation"
    unsafe_control_action: "Untrusted external retrieval or supervisor delegation downgrades taint tier or grants a subordinate agent an exemption from independent safety verification."
    causal_scenario: "Multi-agent supervisor delegates high-risk subtask with authority-framing prompt or resets taint_tier to TIER_0."
    enforced_control: "DelegatedTaintAndHazardGate enforces target_taint >= source_taint + delegation_penalty and rejects any delegation safety exemption flag."
    halt_code: "HALT_DELEGATED_TAINT_DOWNGRADE"
    verification_test: "tests/test_oct2026_runtime_trace_contextcart_and_hazard_gate.py::test_delegated_misalignment_taint_penalty_and_no_exemption"

  - hazard_id: "H-05"
    name: "provenance_laundering"
    unsafe_control_action: "Agent cites a fabricated or unretrieved FactRecord ID in an execution trace without a matching cryptographic retrieval lookup receipt."
    causal_scenario: "Hallucinated or injected claim presented as grounded memory without traversing HyperSUStore."
    enforced_control: "ProvenanceBoundLookupRegistry requires every trace citation to match a recorded provenance_lookup_digest and retrieved_fact_ids set."
    halt_code: "HALT_UNBOUND_OR_FORGED_PROVENANCE_LOOKUP"
    verification_test: "tests/test_oct2026_runtime_trace_contextcart_and_hazard_gate.py::test_provenance_bound_lookup_and_mhg_evolutionary_hyperedge"

  - hazard_id: "H-06"
    name: "vacuous_specification"
    unsafe_control_action: "Builder agent modifies or weakens tests to pass, or runs open-loop iterative self-repair on passing code without a failing deterministic oracle."
    causal_scenario: "Same-context self-grading (Who Verifies the Builder?) or unprovoked iterative bug-fixing (If It's Not Buggy, Don't Fix It)."
    enforced_control: "Independent Assurance Plane + MutationAdequacyGate + TestGatedRepairEnforcer + structured human escalation channel."
    halt_code: "HALT_UNPROVOKED_ITERATIVE_REPAIR_FORBIDDEN"
    verification_test: "tests/test_oct2026_runtime_trace_contextcart_and_hazard_gate.py::test_test_gated_repair_and_escalation_channel"
