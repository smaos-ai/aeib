story: "Basel III Treasury Veto Gate Verification"
description: |
  Verify that a simulated RWA (Risk-Weighted Assets) breach triggers
  a Layer 7 Veto Gate, awaits CRO authorization, and commits the
  cryptographic receipt to the ledger.

setup:
  database: "/tmp/agentacct_star_test.db"
  backend_url: "http://127.0.0.1:8000"
  capsule: "Treasury"
  risk_level: "HIGH"

trace:
  - step: 1
    name: "Trigger Capital Optimization Scenario"
    action: "POST /api/execute"
    payload:
      capsule: "treasuryBaselIII"
      intent:
        amount: "€2400000"
        description: "Loan portfolio RWA rebalancing"
        impact: "CET1 ratio breach (-0.82%)"
    expect:
      status_code: 200
      response_fields:
        - "mandate_id"
        - "trace_id"
        - "status"
    timeout_seconds: 10
    critical: true

  - step: 2
    name: "SSE Stream Intercept & Layer 7 Veto Halt Detection"
    action: "STREAM /api/rce/stream"
    payload: {}
    expect:
      event_type: "veto_halt"
      layer: 7
      contains_fields:
        - "workflow_id"
        - "severity"
        - "reason"
    timeout_seconds: 5
    critical: true

  - step: 3
    name: "CRO Authorization & Ed25519 Signature Override"
    action: "POST /api/rce/decision"
    payload:
      decision: "AUTHORIZE"
      override_reason: "Strategic capital optimization under Basel III Pillar 3 guidelines"
    expect:
      status_code: 200
      response_fields:
        - "receipt_id"
        - "status"
        - "signature"
    timeout_seconds: 5
    critical: true

assertions:
  - name: "All steps completed in order"
    type: "trace_sequence"
    validation: |
      The three steps must execute in strict order:
      1. Intent submission triggers classification
      2. Classification breach triggers veto gate
      3. Veto gate requires human authorization

  - name: "Merkle root is computed from all spans"
    type: "cryptographic"
    validation: |
      SHA-256 hash of all execution spans (leaf hashes combined bottom-up)
      must match the receipt merkle_root field.

  - name: "Ed25519 signature verifies"
    type: "cryptographic"
    validation: |
      The signature must validate against the canonical payload JSON
      using ed25519 curve.

  - name: "Receipt persists to database"
    type: "database"
    validation: |
      SELECT * FROM agentacct_ledger WHERE receipt_id = ?
      must return exactly one row with matching merkle_root and signature.

success_criteria:
  steps_passed: 3
  all_assertions_pass: true
  receipt_generated: true
  cryptographic_proof_valid: true
  no_console_errors: true
  offline_capable: true

edge_cases:
  - name: "Network timeout during Step 2"
    action: "Retry SSE stream with backoff"
    expected_recovery: true

  - name: "Invalid Ed25519 signature"
    action: "Reject receipt, prompt user to re-authorize"
    expected_outcome: "Receipt marked unverified"

  - name: "Database locked during write"
    action: "Retry with exponential backoff"
    expected_outcome: "Receipt eventually persisted"

regulatory_context:
  framework: "Basel III / EU AI Act Article 14"
  articles:
    - "Article 14: High-risk AI systems shall be subject to...human oversight"
    - "Article 49: Significant high-risk AI systems shall maintain a log of events"
  compliance_evidence:
    - "Veto gate halts execution until human authorizes"
    - "Ed25519 signature proves human decision"
    - "Merkle root proves execution trace integrity"
    - "Receipt persisted immutably to ledger"

metadata:
  created_at: "2026-09-02T00:00:00Z"
  author: "STAR Framework"
  version: "1.0.0"
  acceptance_criteria_met: false  # Will be updated after run
