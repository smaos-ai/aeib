story: "Receipt Ledger Persistence Verification"
description: "Verify that receipts are correctly written to SQLite ledger"

setup:
  database: "/tmp/agentacct_star_test.db"
  backend_url: "http://127.0.0.1:8000"
  capsule: "Treasury"

trace:
  - step: 1
    name: "Submit intent for ledger test"
    action: "POST /api/execute"
    payload:
      capsule: "treasuryBaselIII"
      intent:
        amount: "€1500000"
        description: "Ledger verification transfer"
    expect:
      status_code: 200
    timeout_seconds: 5

  - step: 2
    name: "Trigger veto gate"
    action: "STREAM /api/rce/stream"
    expect:
      event_type: "veto_halt"
    timeout_seconds: 5

  - step: 3
    name: "Authorize and generate receipt"
    action: "POST /api/rce/decision"
    payload:
      decision: "authorize"
    expect:
      status_code: 200
    timeout_seconds: 5

  - step: 4
    name: "Verify receipt in database"
    action: "QUERY /tmp/agentacct_star_test.db"
    query: "SELECT COUNT(*) FROM agentacct_ledger WHERE status='APPROVED_WITH_OVERRIDE'"
    expect:
      row_count_increased: true
    timeout_seconds: 5

assertions:
  - name: "Receipt persisted to ledger"
    type: "database"
    validation: "New row exists in agentacct_ledger with matching receipt_id"

success_criteria:
  steps_passed: 4
  database_write_verified: true

metadata:
  created_at: "2026-09-04T00:00:00Z"
  version: "1.0.0"
